<script>
    const container = document.getElementById('content');
    const buttons = Array.from(container.querySelectorAll('.imgbox'));
    const explanations = Array.from(container.querySelectorAll('.explanation'));
    
    window.addEventListener('keydown', (e) => {
        let currentIdx = buttons.indexOf(document.activeElement);

        // 방향키가 아니면 무시
        const isArrow = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key);
        if (!isArrow) return;

        e.preventDefault(); // 방향키 기본 스크롤 방지

        // 1. 포커스가 없는 경우
        if (currentIdx === -1) {
            buttons[0].setAttribute('tabindex', '0');
            buttons[0].focus();
            explanations[0].setAttribute('class', 'hoverexplanation');
            console.log('초기 포커스 설정 완료');
            return;
        }
        
        let nextIdx;
        if (e.key === 'ArrowRight') {
            nextIdx = (currentIdx + 1) % buttons.length; // 순환 구조
            e.preventDefault(); // 스크롤 방지
        } else if (e.key === 'ArrowLeft') {
            nextIdx = (currentIdx - 1 + buttons.length) % buttons.length;
            e.preventDefault();
        } else if (e.key === 'ArrowDown') {
            nextIdx = (currentIdx + 5 + buttons.length) % buttons.length;
            e.preventDefault();
        } else if (e.key === 'ArrowUp') {
            nextIdx = (currentIdx - 5 + buttons.length) % buttons.length;
            e.preventDefault();
        }

        if (nextIdx !== undefined) {
            // tabindex 업데이트 (기존 포커스 제거, 새 포커스 설정)
            buttons[currentIdx].setAttribute('tabindex', '-1');
            explanations[currentIdx].setAttribute('class', 'explanation');
            buttons[nextIdx].setAttribute('tabindex', '0');
            explanations[nextIdx].setAttribute('class', 'hoverexplanation');
            buttons[nextIdx].focus();
        }
    });
</script>
