        }
        
        .imgbox:focus-visible {
            border-image-repeat: round;
            border-image: radial-gradient(closest-side at 1%, lch(89.23% 31.81 201.19), magenta);
            border-image-width: 4.5vw;
            border-image-repeat: round;
            /*
            border-image: radial-gradient(closest-side at 20%, magenta, lch(89.23% 31.81 201.19));

        .imgbox img{

            height: 100%;
            margin: 0 auto;
            object-fit : cover;
        }
    </style>

<script>
    const container = document.getElementById('content');
    const buttons = Array.from(container.querySelectorAll('.imgbox'));

    container.addEventListener('keydown', (e) => {
        let currentIdx = buttons.indexOf(document.activeElement);
        if (currentIdx === -1) return;

        let nextIdx;
        if (e.key === 'ArrowRight') {
            nextIdx = (currentIdx + 1) % buttons.length; // 순환 구조
            e.preventDefault(); // 스크롤 방지
        } else if (e.key === 'ArrowLeft') {
            nextIdx = (currentIdx - 1 + buttons.length) % buttons.length;
            e.preventDefault();
        } else if (e.key === 'ArrowDown') {
            nextIdx = (currentIdx + 5 + buttons.length) % buttons.length;
            e.preventDefault();
        } else if (e.key === 'ArrowUp') {
            nextIdx = (currentIdx - 5 + buttons.length) % buttons.length;
            e.preventDefault();
        }

        if (nextIdx !== undefined) {
            // tabindex 업데이트 (기존 포커스 제거, 새 포커스 설정)
            buttons[currentIdx].setAttribute('tabindex', '-1');
            buttons[nextIdx].setAttribute('tabindex', '0');
            buttons[nextIdx].focus();
        }
    });
</script>
