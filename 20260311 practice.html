<script>
    //가로 세로 길이에 따라 설명창 보이게 or 안보이게
    function updateHeader() {
        const verticalMode = getComputedStyle(document.body)
        .getPropertyValue('--vertical-mode')
        .trim();

        if (verticalMode === "1") {
            document.getElementById("header").style.display = 'flex';
        }
        else {
            document.getElementById("header").style.display = 'none';
        }
    }

    updateHeader();
    window.addEventListener("resize", updateHeader);
    

    const container = document.getElementById('content');
    const buttons = Array.from(container.querySelectorAll('.imgbox'));
    const explanations = Array.from(container.querySelectorAll('.explanation'));
    
    //마우스 hover 시에도 focus 되게 하는 함수
    for(let j = 0; j < buttons.length; j++)
    {
        buttons[j].addEventListener("mouseenter", (b) => {
            b.target.focus();
            for(k = 0; k < buttons.length; k++)
            {
                explanations[k].setAttribute('class', 'explanation');
            }
            explanations[j].setAttribute('class', 'hoverexplanation');
            //상단 박스의 텍스트 & 이미지 바꾸기
            document.querySelector("#main B").textContent = explanations[j].textContent;
            //여기부터 다음에
            /* document.getElementById("headimg").src = buttons[j].querySelector("img").src; */
        });

        buttons[j].addEventListener("mouseleave", (b) => {
            document.activeElement.blur();
            explanations[j].setAttribute('class', 'explanation');
        });
    }
    window.addEventListener('keydown', (e) => {
        let currentIdx = buttons.indexOf(document.activeElement);

        // 방향키가 아니면 무시
        const isArrow = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key);
        if (!isArrow) return;

        e.preventDefault(); // 방향키 기본 스크롤 방지

        // 1. 포커스가 없는 경우
        if (currentIdx === -1) {
            buttons[0].setAttribute('tabindex', '0');
            buttons[0].focus();
            explanations[0].setAttribute('class', 'hoverexplanation');
            console.log('초기 포커스 설정 완료');
            return;
        }
        
        let nextIdx;
        if (e.key === 'ArrowRight') {
            nextIdx = (currentIdx + 1) % buttons.length; // 순환 구조
            e.preventDefault(); // 스크롤 방지
        } else if (e.key === 'ArrowLeft') {
            nextIdx = (currentIdx - 1 + buttons.length) % buttons.length;
            e.preventDefault();
        } else if (e.key === 'ArrowDown') {
            nextIdx = (currentIdx + 5 + buttons.length) % buttons.length;
            e.preventDefault();
        } else if (e.key === 'ArrowUp') {
            nextIdx = (currentIdx - 5 + buttons.length) % buttons.length;
            e.preventDefault();
        }

        if (nextIdx !== undefined) {
            // tabindex 업데이트 (기존 포커스 제거, 새 포커스 설정)
            buttons[currentIdx].setAttribute('tabindex', '-1');
            explanations[currentIdx].setAttribute('class', 'explanation');
            buttons[nextIdx].setAttribute('tabindex', '0');
            explanations[nextIdx].setAttribute('class', 'hoverexplanation');
            buttons[nextIdx].focus();
            //상단 박스의 텍스트 바꾸기
            document.querySelector("#main B").textContent = explanations[nextIdx].textContent;
        }
    });

    function checkFocus() {
        setTimeout(() => {
            if (document.activeElement === document.body) {
                for(i = 0; i < explanations.length; i++) {
                    explanations[i].setAttribute('class', 'explanation');
                }
            }
        }, 0);
    }

    document.addEventListener("focusin", checkFocus);
    document.addEventListener("focusout", checkFocus);
    

</script>
